name: Test and deploy to GitHub Pages

# Tests and builds on every push to main, then publishes dist/ to the gh-pages branch,
# which GitHub Pages serves (Settings → Pages → Deploy from a branch → gh-pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Optional event backend. Set these as repository *variables* (Settings → Secrets and
          # variables → Actions → Variables). Both are public browser values, never secrets.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
